services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-users}
      POSTGRES_USER: ${POSTGRES_USER:-rail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-debug123}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data/
      - ./init.sql:/docker-entrypoint-initdb.d/0-init.sql

  server:
    build: .
    restart: unless-stopped
    ports:
      - '8000:8000'
    depends_on:
      - db
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rail}:${POSTGRES_PASSWORD:-debug123}@db:5432/${POSTGRES_DB:-users}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-prod}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_DEV: ${STRIPE_PRICE_DEV:-}
      STRIPE_PRICE_TEAM: ${STRIPE_PRICE_TEAM:-}
      SITE_DOMAIN: ${SITE_DOMAIN:-https://debug.secureai.dev}
      XAI_API_KEY: ${XAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:-}
      GITHUB_APP_CLIENT_SECRET: ${GITHUB_APP_CLIENT_SECRET:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}

volumes:
  postgres_data: