name: Auto Deploy to Production

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed file types
        id: diff
        run: |
          git diff --name-only HEAD~1 HEAD 2>/dev/null > /tmp/changed.txt || git show --name-only --format="" HEAD > /tmp/changed.txt
          echo "Changed files:"
          cat /tmp/changed.txt

          if grep -qE '^web/' /tmp/changed.txt; then
            echo "web=true" >> $GITHUB_OUTPUT
          else
            echo "web=false" >> $GITHUB_OUTPUT
          fi

          if grep -qE '^(core|routes|services)/|^server\.py$|^requirements\.txt$|^Dockerfile$|^\.dockerignore$' /tmp/changed.txt; then
            echo "backend=true" >> $GITHUB_OUTPUT
          else
            echo "backend=false" >> $GITHUB_OUTPUT
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          WEB: ${{ steps.diff.outputs.web }}
          BACKEND: ${{ steps.diff.outputs.backend }}
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: root
          key: ${{ secrets.DROPLET_SSH_KEY }}
          envs: WEB,BACKEND,MIGRATION
          command_timeout: 10m
          script: |
            set -e
            cd /opt/rail-debug
            git fetch origin && git reset --hard origin/master

            if [ "$WEB" = "true" ]; then
              echo "Copying web files..."
              cp -r web/* /var/www/rail-debug/
            fi

            if [ "$BACKEND" = "true" ]; then
              echo "Rebuilding backend container..."
              docker compose up -d --build server
            fi

            # Run all migrations to ensure DB is up to date
            export PGPASSWORD=debug123
            for mig in migrations/*.sql; do
              if [ -f "$mig" ]; then
                echo "Applying migration: $mig"
                docker exec -e PGPASSWORD -i $(docker compose ps -q db) psql -U rail -d users < $mig
              fi
            done
            unset PGPASSWORD

            # Ensure server is running after migrations
            docker compose up -d server

      - name: Health check
        run: |
          echo "Waiting 30s before first check..."
          sleep 30
          for i in $(seq 1 10); do
            STATUS=$(curl -sf https://debug.secureai.dev/api/health 2>/dev/null \
              | python3 -c "import sys,json; print(json.load(sys.stdin).get('status',''))" 2>/dev/null \
              || echo "")
            if [ "$STATUS" = "ok" ]; then
              echo "Health check passed on attempt $i"
              exit 0
            fi
            echo "Attempt $i/10 failed — retrying in 30s..."
            sleep 30
          done
          echo "Health check failed after 5 minutes"
          exit 1

      - name: Notify Telegram — success
        if: success()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MSG="Auto-deploy complete - health check passed. DB migrations applied."
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d '{"chat_id": "'${CHAT_ID}'", "text": "'${MSG}'"}' || true

      - name: Notify Telegram — failure
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d '{"chat_id": "'${CHAT_ID}'", "text": "Auto-deploy FAILED - check GitHub Actions logs."}' || true